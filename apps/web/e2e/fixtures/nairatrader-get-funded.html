<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!--[if mso]><table role="presentation"><tr><td>Outlook layout</td></tr></table><![endif]-->
  <style>
    .email-shell { width: 600px; }
    .price-row td { white-space: nowrap; letter-spacing: .01em; }
    @media screen and (max-width: 620px) {
      .email-shell { width: 100% !important; }
      .price-row td { white-space: normal !important; }
    }
  </style>
</head>
<body style="margin:0;padding:0">
  <table class="email-shell" width="600" cellpadding="0" cellspacing="0" bgcolor="#ffffff" style="box-sizing:border-box;margin-top:0px;margin-right:auto;margin-bottom:0px;margin-left:auto;border-top-left-radius:12px;border-top-right-radius:12px">
    <tr>
      <td align="center" style="padding:20px;mso-table-lspace:0pt;mso-table-rspace:0pt">
        <a href="https://nairatrader.example/" target="_blank">
          <img src="https://res.cloudinary.com/nairatrader/image/upload/v1/brand/logo.png" width="180" alt="NairaTrader">
        </a>
      </td>
    </tr>
    <tr>
      <td align="center" style="padding-top:16px;padding-right:24px;padding-bottom:16px;padding-left:24px">
        <h1 style="margin-top:0px;margin-right:0px;margin-bottom:16px;margin-left:0px;font-size:30px;letter-spacing:.02em">Welcome {{organization}} - Get Funded</h1>
        <p>Choose an account size and start your evaluation.</p>
      </td>
    </tr>
    <tr class="price-row" bgcolor="#f7f7f7">
      <td>
        <table width="100%" cellpadding="12" cellspacing="0">
          <tr>
            <td>25,000 account</td><td align="right">$149 fee</td>
            <td align="right"><a href="https://nairatrader.example/funded/25k" target="_blank" style="display:inline-block;padding:12px;background:#ff4d2e;color:#fff">Get funded</a></td>
          </tr>
          <tr>
            <td>50,000 account</td><td align="right">$249 fee</td>
            <td align="right"><a href="https://nairatrader.example/funded/50k" target="_blank" style="display:inline-block;padding:12px;background:#ff4d2e;color:#fff">Get funded</a></td>
          </tr>
          <tr>
            <td>100,000 account</td><td align="right">$449 fee</td>
            <td align="right"><a href="https://nairatrader.example/funded/100k" target="_blank" style="display:inline-block;padding:12px;background:#ff4d2e;color:#fff">Get funded</a></td>
          </tr>
        </table>
      </td>
    </tr>
    <tr>
      <td align="center" style="padding:18px">
        <p>Follow NairaTrader:
          <a href="https://instagram.com/nairatrader" target="_blank">Instagram</a> |
          <a href="https://x.com/nairatrader" target="_blank">X</a> |
          <a href="https://linkedin.com/company/nairatrader" target="_blank">LinkedIn</a>
        </p>
        <a href="https://nairatrader.example/" target="_blank">
          <img src="https://res.cloudinary.com/nairatrader/image/upload/v1/brand/mark.png" width="48" alt="NairaTrader mark">
        </a>
      </td>
    </tr>
    <tr>
      <td align="center" style="padding:12px">
        <a href="{{unsubscribe_url}}">Unsubscribe from these updates</a>
      </td>
    </tr>
  </table>
</body>
</html>
