    delete:
      tags: [auth]
      summary: Revoke an organization API key
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: API key revoked }
        '403': { description: Owner or admin role required }
