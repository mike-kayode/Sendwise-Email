        '403': { description: Owner or admin role required }
    post:
      tags: [auth]
      summary: Create an organization API key
      description: The returned plain_key is shown once and is not stored by the server.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                scopes: { type: array, items: { type: string } }
                expires_at: { type: string, format: date-time }
      responses:
        '201': { description: API key created; plain_key returned once }
        '400': { description: Invalid request }
        '403': { description: Owner or admin role required }
