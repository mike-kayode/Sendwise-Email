openapi: 3.0.3
info:
  title: Sendwise Email Marketing API
  version: 1.0.0
  description: |
    Versioned REST API for the Sendwise self-hosted email marketing platform.
    All tenant-owned endpoints require authentication and enforce organization-level
    access. Stalwart SMTP is the initial transport, abstracted behind a replaceable
    Go interface.
servers:
  - url: http://localhost:8080
    description: Local development
  - url: https://api.sendwise.example.com
    description: Production
tags:
  - name: auth
  - name: contacts
  - name: audiences
  - name: forms
  - name: campaigns
  - name: templates
  - name: domains
  - name: analytics
  - name: public
  - name: health
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: invalid_email }
            message: { type: string, example: Enter a valid email address. }
    Pagination:
      type: object
      properties:
        total: { type: integer, example: 124 }
        limit: { type: integer, example: 50 }
        offset: { type: integer, example: 0 }
    ListResponse:
      type: object
      required: [data, pagination]
      properties:
        data: { type: array }
        pagination: { $ref: '#/components/schemas/Pagination' }
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        status: { type: string }
        created_at: { type: string, format: date-time }
    Organization:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        plan: { type: string }
        status: { type: string }
    Contact:
      type: object
      required: [email, status]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        first_name: { type: string }
        last_name: { type: string }
        status: { type: string, enum: [pending, subscribed, unsubscribed, bounced, complained, suppressed] }
        custom_fields: { type: object }
    ContactConsent:
      type: object
      required: [source, purpose, evidence]
      properties:
        source: { type: string, minLength: 1, maxLength: 128 }
        purpose: { type: string, enum: [marketing] }
        evidence:
          type: object
          minProperties: 1
          description: Evidence provided for the contact's marketing opt-in.
    SegmentRules:
      type: object
      required: [groups]
      properties:
        groups:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            required: [match, conditions]
            properties:
              match: { type: string, enum: [AND, OR] }
              conditions:
                type: array
                minItems: 1
                maxItems: 50
                items:
                  type: object
                  required: [field, operator]
                  properties:
                    field:
                      type: string
                      pattern: '^(email|status|tag|list|created_at|custom_fields\.[A-Za-z][A-Za-z0-9_]{0,62})$'
                    operator:
                      type: string
                      enum: [equals, not_equals, contains, does_not_contain, is_empty, is_not_empty, before, after]
                    value: { type: string }
    ContactList:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        contact_count: { type: integer }
    SignupFormField:
      type: object
      required: [field_type, label]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        field_type: { type: string, enum: [email, first_name, last_name, phone, company, country, custom] }
        label: { type: string }
        placeholder: { type: string }
        required: { type: boolean }
        position: { type: integer }
        custom_key: { type: string }
        options: { type: array, items: {} }
    SignupForm:
      type: object
      required: [id, name, slug, status, fields]
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string, description: Globally unique public form slug }
        description: { type: string }
        status: { type: string, enum: [draft, published, unpublished] }
        list_id: { type: string, format: uuid }
        success_message: { type: string }
        redirect_url: { type: string, format: uri }
        consent_text: { type: string }
        spam_protection: { type: boolean }
        double_opt_in: { type: boolean }
        fields: { type: array, items: { $ref: '#/components/schemas/SignupFormField' } }
        tag_ids: { type: array, items: { type: string, format: uuid } }
    SignupFormInput:
      type: object
      required: [name, fields]
      properties:
        name: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 2000 }
        list_id: { type: string, format: uuid }
        success_message: { type: string, maxLength: 1000 }
        redirect_url: { type: string, format: uri }
        consent_text: { type: string, maxLength: 1000 }
        spam_protection: { type: boolean }
        double_opt_in: { type: boolean }
        fields: { type: array, minItems: 1, maxItems: 30, items: { $ref: '#/components/schemas/SignupFormField' } }
        tag_ids: { type: array, items: { type: string, format: uuid } }
    SignupFormSubmission:
      type: object
      properties:
        id: { type: string, format: uuid }
        form_id: { type: string, format: uuid }
        data: { type: object, additionalProperties: { type: string } }
        consent: { type: boolean }
        created_at: { type: string, format: date-time }
    Campaign:
      type: object
      required: [name, subject, sender_name, sender_email, status]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        name: { type: string }
        subject: { type: string }
        preview_text: { type: string }
        sender_name: { type: string }
        sender_email: { type: string, format: email }
        reply_to: { type: string, format: email }
        status: { type: string, enum: [draft, ready, scheduled, processing, sending, paused, completed, cancelled, failed] }
        recipient_count: { type: integer }
        track_opens: { type: boolean }
        track_clicks: { type: boolean }
        scheduled_at: { type: string, format: date-time }
    SendingDomain:
      type: object
      properties:
        id: { type: string, format: uuid }
        domain: { type: string }
        status: { type: string, enum: [pending, verified, misconfigured] }
        spf_status: { type: string }
        dkim_status: { type: string }
        dmarc_status: { type: string }
    AnalyticsOverview:
      type: object
      properties:
        contacts: { type: integer }
        subscribed: { type: integer }
        emails_submitted: { type: integer }
        opens: { type: integer }
        clicks: { type: integer }
        bounces: { type: integer }
        complaints: { type: integer }
        unsubscribes: { type: integer }
        open_rate: { type: number }
        click_rate: { type: number }
        bounce_rate: { type: number }
paths:
  /healthz:
    get:
      tags: [health]
      summary: Liveness check
      security: []
      responses:
        '200': { description: OK }
  /readyz:
    get:
      tags: [health]
      summary: Readiness check
      security: []
      responses:
        '200': { description: Ready }
  /metrics:
    get:
      tags: [health]
      summary: Prometheus metrics
      security: []
      responses:
        '200': { description: Prometheus metrics }

  /api/v1/auth/register:
    post:
      tags: [auth]
      summary: Register user and create organization
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, name, organization_name]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 10 }
                name: { type: string }
                organization_name: { type: string }
      responses:
        '201': { description: User and workspace created; access token returned }
        '400': { description: Invalid registration payload }
        '409': { description: Email in use }

  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: Authenticate a user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '200': { description: Access token and workspace returned }
        '401': { description: Invalid credentials }
        '403': { description: Inactive user or missing workspace }

  /api/v1/auth/me:
    get:
      tags: [auth]
      summary: Get the authenticated user and active workspace
      responses:
        '200': { description: Current user and organization membership }
        '401': { description: Authentication required }

  /api/v1/contacts:
    get:
      tags: [contacts]
      summary: List contacts for the authenticated organization
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: search, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
      responses:
        '200':
          description: Paginated contact results
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Contact' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
    post:
      tags: [contacts]
      summary: Create a contact
      description: Contacts default to pending. Setting subscribed requires consent source, marketing purpose, and evidence; suppressed addresses cannot be subscribed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                first_name: { type: string }
                last_name: { type: string }
                status: { type: string, enum: [pending, subscribed], default: pending }
                custom_fields: { type: object, additionalProperties: true }
                source: { type: string }
                consent: { $ref: '#/components/schemas/ContactConsent' }
      responses:
        '201': { description: Contact created }
        '400': { description: Invalid contact payload }
        '409': { description: Contact already exists in this organization }

  /api/v1/contacts/import:
    post:
      tags: [contacts]
      summary: Queue a contact CSV import
      description: Uploads up to 16 MiB and 100,000 data rows. Mapping can be supplied as a JSON string form field. Every imported contact is pending; CSV status/source columns do not set consent. Duplicate emails are skipped and invalid rows are reported in job status.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                mapping:
                  type: string
                  description: Optional JSON CSVColumnMapping with email, first_name, last_name, and custom_fields header-to-key mappings.
      responses:
        '202': { description: Import job queued with an id and queued status }
        '400': { description: Invalid upload or CSV format }
        '413': { description: Upload exceeds the size limit }

  /api/v1/contact-imports/{id}:
    get:
      tags: [contacts]
      summary: Get organization-scoped contact import progress
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Current import status, counters, and up to 100 row errors
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  status: { type: string, enum: [queued, processing, completed, failed] }
                  file_name: { type: string }
                  total_rows: { type: integer }
                  processed_rows: { type: integer }
                  imported: { type: integer }
                  skipped: { type: integer }
                  invalid: { type: integer }
                  errors: { type: array, items: { type: object } }
                  last_error: { type: string }
        '404': { description: Import not found in this organization }

  /api/v1/contacts/export:
    get:
      tags: [contacts]
      summary: Export organization contacts as CSV
      responses:
        '200':
          description: CSV export
          content:
            text/csv:
              schema: { type: string }

  /api/v1/contacts/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [contacts]
      summary: Get a contact
      responses:
        '200': { description: Contact details }
        '404': { description: Contact not found }
    patch:
      tags: [contacts]
      summary: Update a contact
      description: A contact can only be moved to subscribed with explicit consent source, marketing purpose, and evidence. Suppressed addresses cannot be subscribed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email }
                first_name: { type: string }
                last_name: { type: string }
                status: { type: string, enum: [pending, subscribed] }
                custom_fields: { type: object, additionalProperties: true }
                source: { type: string }
                consent: { $ref: '#/components/schemas/ContactConsent' }
      responses:
        '200': { description: Contact updated }
        '400': { description: Invalid contact payload }
        '404': { description: Contact not found }
    delete:
      tags: [contacts]
      summary: Delete a contact
      responses:
        '204': { description: Contact deleted }
        '404': { description: Contact not found }

  /api/v1/lists:
    get:
      tags: [audiences]
      security: [{ BearerAuth: [] }]
      summary: List contact lists
      responses:
        '200': { description: Contact lists }
    post:
      tags: [audiences]
      security: [{ BearerAuth: [] }]
      summary: Create a contact list
      responses:
        '201': { description: Contact list created }
  /api/v1/lists/{id}:
    get:
      tags: [audiences]
      security: [{ BearerAuth: [] }]
      summary: Get a list and its current member count
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Contact list }
        '404': { description: List not found in the authenticated organization }
    patch:
      tags: [audiences]
      security: [{ BearerAuth: [] }]
      summary: Rename or update a list
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                description: { type: string }
      responses:
        '204': { description: List updated }
        '404': { description: List not found in the authenticated organization }
    delete:
      tags: [audiences]
      security: [{ BearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '204': { description: Deleted } }
  /api/v1/lists/{id}/contacts:
    get:
      tags: [audiences]
      security: [{ BearerAuth: [] }]
      summary: List paginated members of a list
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200': { description: Paginated list members with total, limit, and offset }
        '404': { description: List not found in the authenticated organization }
    post:
      tags: [audiences]
      security: [{ BearerAuth: [] }]
      summary: Add contacts to a list
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contact_ids]
              properties:
                contact_ids: { type: array, items: { type: string, format: uuid }, minItems: 1, maxItems: 500 }
      responses:
        '204': { description: Membership added }
        '404': { description: List or contact not found in the authenticated organization }
  /api/v1/lists/{id}/contacts/{contactID}:
    delete:
      tags: [audiences]
      security: [{ BearerAuth: [] }]
      summary: Remove a contact from a list without deleting the contact
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: contactID, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Membership removed }
        '404': { description: List or contact not found in the authenticated organization }
  /api/v1/lists/{id}/contacts/export:
    get:
      tags: [audiences]
      security: [{ BearerAuth: [] }]
      summary: Export list members as CSV
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: CSV file of list members, content: { text/csv: {} } }
        '404': { description: List not found in the authenticated organization }

  /api/v1/tags:
    get:
      tags: [audiences]
      security: [{ BearerAuth: [] }]
      summary: List tags
      responses:
        '200': { description: Tags }
    post:
      tags: [audiences]
      security: [{ BearerAuth: [] }]
      summary: Create a tag
      responses:
        '201': { description: Tag created }
  /api/v1/tags/{id}:
    patch:
      tags: [audiences]
      security: [{ BearerAuth: [] }]
      summary: Rename or recolor a tag
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '204': { description: Tag updated }
        '404': { description: Tag not found in the authenticated organization }
    delete:
      tags: [audiences]
      security: [{ BearerAuth: [] }]
      summary: Delete a tag and its assignments
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '204': { description: Tag deleted }
        '404': { description: Tag not found in the authenticated organization }
  /api/v1/contacts/tags:
    post:
      tags: [audiences]
      security: [{ BearerAuth: [] }]
      summary: Bulk assign a tag to contacts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tag_id, contact_ids]
              properties:
                tag_id: { type: string, format: uuid }
                contact_ids: { type: array, items: { type: string, format: uuid }, minItems: 1, maxItems: 500 }
      responses:
        '204': { description: Tag assigned }
        '404': { description: Tag or contact not found in the authenticated organization }
  /api/v1/contacts/{id}/tags:
    get:
      tags: [audiences]
      security: [{ BearerAuth: [] }]
      summary: List a contact's tags
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200': { description: Paginated contact tags }
        '404': { description: Contact not found in the authenticated organization }
  /api/v1/contacts/{id}/tags/{tagID}:
    post:
      tags: [audiences]
      security: [{ BearerAuth: [] }]
      summary: Assign a tag to a contact
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: tagID, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Tag assigned }
        '404': { description: Tag or contact not found in the authenticated organization }
    delete:
      tags: [audiences]
      security: [{ BearerAuth: [] }]
      summary: Unassign a tag from a contact
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: tagID, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Tag unassigned }
        '404': { description: Tag or contact not found in the authenticated organization }
  /api/v1/forms:
    get:
      tags: [forms]
      summary: List signup forms in the authenticated organization
      responses:
        '200': { description: Signup forms }
        '401': { description: Authentication required }
    post:
      tags: [forms]
      summary: Create a signup form and its fields
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignupFormInput' }
      responses:
        '201': { description: Signup form created }
        '400': { description: Invalid form or audience association }
        '409': { description: Form slug already exists }
  /api/v1/forms/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [forms]
      summary: Get a signup form and its field configuration
      responses:
        '200': { description: Signup form with fields and audience configuration }
        '404': { description: Form not found in the authenticated organization }
    patch:
      tags: [forms]
      summary: Update a signup form and replace its ordered fields
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignupFormInput' }
      responses:
        '200': { description: Updated signup form }
        '400': { description: Invalid form configuration }
        '404': { description: Form not found in the authenticated organization }
    delete:
      tags: [forms]
      summary: Delete a signup form and its submissions
      responses:
        '204': { description: Form deleted }
        '404': { description: Form not found in the authenticated organization }
  /api/v1/forms/{id}/publish:
    post:
      tags: [forms]
      summary: Publish a signup form
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Form published }
        '404': { description: Form not found }
  /api/v1/forms/{id}/unpublish:
    post:
      tags: [forms]
      summary: Unpublish a signup form
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Form unpublished }
        '404': { description: Form not found }
  /api/v1/forms/{id}/submissions:
    get:
      tags: [forms]
      summary: List a form's submissions
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200': { description: Paginated form submissions }
        '404': { description: Form not found in the authenticated organization }
  /api/v1/segments:
    get:
      tags: [audiences]
      security: [{ BearerAuth: [] }]
      summary: List segments
      responses:
        '200': { description: Segments }
    post:
      tags: [audiences]
      security: [{ BearerAuth: [] }]
      summary: Create a segment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, rules]
              properties:
                name: { type: string }
                description: { type: string }
                rules: { $ref: '#/components/schemas/SegmentRules' }
      responses:
        '201': { description: Segment created }
        '400': { description: Invalid segment rules }

  /api/v1/segments/{id}:
    delete:
      tags: [audiences]
      summary: Delete a segment
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Segment deleted }
        '404': { description: Segment not found in the authenticated organization }
  /api/v1/segments/{id}/contacts:
    get:
      tags: [audiences]
      security: [{ BearerAuth: [] }]
      summary: List paginated segment contacts
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200': { description: Paginated segment contacts evaluated from the saved rules }
        '404': { description: Segment not found in the authenticated organization }
  /api/v1/segments/preview:
    post:
      tags: [audiences]
      security: [{ BearerAuth: [] }]
      summary: Preview segment rules with count and up to ten contacts
      requestBody:
