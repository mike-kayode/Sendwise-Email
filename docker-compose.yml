name: email-platform

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-email}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-email}
      POSTGRES_DB: ${POSTGRES_DB:-email}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-email} -d ${POSTGRES_DB:-email}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data"]
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    volumes:
      - nats-data:/data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

  stalwart:
    image: stalwartlabs/stalwart@sha256:73c684a84c24f5b4206ec266a8deb8986fe44a9f623997e07f084388d943c8bd
    hostname: mail.localhost
    environment:
      STALWART_RECOVERY_ADMIN: ${STALWART_RECOVERY_ADMIN:-}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "openssl s_client -starttls smtp -connect 127.0.0.1:587 -servername localhost -brief </dev/null 2>&1 | grep -q 'Ciphersuite:' && openssl s_client -connect 127.0.0.1:465 -servername localhost -brief </dev/null 2>&1 | grep -q 'Ciphersuite:'",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    ports:
      - "${STALWART_BIND_ADDRESS:-127.0.0.1}:${STALWART_PORT_25:-25}:25"
      - "${STALWART_BIND_ADDRESS:-127.0.0.1}:${STALWART_PORT_465:-465}:465"
      - "${STALWART_BIND_ADDRESS:-127.0.0.1}:${STALWART_PORT_587:-587}:587"
      - "127.0.0.1:${STALWART_ADMIN_PORT:-8081}:8080"
    volumes:
      - stalwart-data:/opt/stalwart
      - ${STALWART_CERTS_DIR:-./secrets/stalwart/certs}:/etc/stalwart/certs:ro
    # This host's provider drops NAT-forwarded outbound port-25 traffic unless
    # Stalwart's packets leave the bridge with the host's effective TTL (64).
    sysctls:
      - net.ipv4.ip_default_ttl=65
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    profiles: ["storage"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data

  migrate:
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-email}:${POSTGRES_PASSWORD:-email}@postgres:5432/${POSTGRES_DB:-email}?sslmode=disable
      MIGRATIONS_DIR: /app/migrations
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # One-shot Identity/Workspace -> legacy projection. Never starts with the
  # stack; only `docker compose run --rm backfill` (or DEPLOY_BACKFILL=1 on
  # scripts/deploy.sh) executes it. Idempotent: re-running updates in place.
  backfill:
    build:
      context: .
      target: backfill
    environment:
      IDENTITY_DATABASE_URL: postgres://${POSTGRES_USER:-email}:${POSTGRES_PASSWORD:-email}@postgres:5432/identity?sslmode=disable
      WORKSPACE_DATABASE_URL: postgres://${POSTGRES_USER:-email}:${POSTGRES_PASSWORD:-email}@postgres:5432/workspace?sslmode=disable
      LEGACY_DATABASE_URL: postgres://${POSTGRES_USER:-email}:${POSTGRES_PASSWORD:-email}@postgres:5432/${POSTGRES_DB:-email}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      target: api
    environment:
      APP_ENV: ${APP_ENV:-development}
      HTTP_ADDR: ":8080"
      WORKER_METRICS_ADDR: ${WORKER_METRICS_ADDR:-:9091}
      DATABASE_URL: postgres://${POSTGRES_USER:-email}:${POSTGRES_PASSWORD:-email}@postgres:5432/${POSTGRES_DB:-email}?sslmode=disable
      NATS_URL: nats://nats:4222
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_ISSUER: ${JWT_ISSUER:-email-platform}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?Set WEBHOOK_SECRET in .env}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost}
      API_BASE_URL: ${API_BASE_URL:-http://localhost}
      TRACKING_BASE_URL: ${TRACKING_BASE_URL:-http://localhost}
      AUTO_MIGRATE: ${AUTO_MIGRATE:-false}
      MIGRATIONS_DIR: /app/migrations
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      SMTP_ADDR: ${SMTP_ADDR:-mailpit:1025}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-newsletter@example.com}
      SMTP_POOL_SIZE: ${SMTP_POOL_SIZE:-10}
      CONTACT_NOTIFY_EMAIL: ${CONTACT_NOTIFY_EMAIL:-}
      STALWART_MANAGEMENT_URL: ${STALWART_MANAGEMENT_URL:-http://stalwart:8080}
      STALWART_ADMIN_USERNAME: ${STALWART_ADMIN_USERNAME:-}
      STALWART_ADMIN_PASSWORD: ${STALWART_ADMIN_PASSWORD:-}
      DKIM_SELECTOR: ${DKIM_SELECTOR:-mail}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-auto}
      DKIM_ENCRYPTION_KEY: ${DKIM_ENCRYPTION_KEY:-}
      SPF_INCLUDE: ${SPF_INCLUDE:-}
      DNS_RESOLVER_ADDR: ${DNS_RESOLVER_ADDR:-}
      DNS_RESOLVER_TIMEOUT: ${DNS_RESOLVER_TIMEOUT:-2s}
      SENDING_RATE_PER_SECOND: ${SENDING_RATE_PER_SECOND:-20}
      PLATFORM_MAX_DOMAIN_RATE: ${PLATFORM_MAX_DOMAIN_RATE:-1000}
      MAX_DELIVERY_ATTEMPTS: ${MAX_DELIVERY_ATTEMPTS:-5}
      SCHEDULER_INTERVAL: ${SCHEDULER_INTERVAL:-15s}
      MAX_MESSAGE_AGE: ${MAX_MESSAGE_AGE:-48h}
      NATS_STALE_PUBLISH_TIMEOUT: ${NATS_STALE_PUBLISH_TIMEOUT:-10m}
      DELIVERY_JOURNEY_RECONCILE_INTERVAL: ${DELIVERY_JOURNEY_RECONCILE_INTERVAL:-1m}
      DELIVERY_JOURNEY_RECONCILE_BATCH: ${DELIVERY_JOURNEY_RECONCILE_BATCH:-100}
      DELIVERY_JOURNEY_STUCK_AFTER: ${DELIVERY_JOURNEY_STUCK_AFTER:-30m}
      DELIVERY_JOURNEY_LEGACY_BOUNCE_DOMAINS: ${DELIVERY_JOURNEY_LEGACY_BOUNCE_DOMAINS:-}
      MAX_DAILY_EMAILS: ${MAX_DAILY_EMAILS:-10000}
      WARMUP_START_PER_DAY: ${WARMUP_START_PER_DAY:-50}
      WARMUP_GROWTH_FACTOR: ${WARMUP_GROWTH_FACTOR:-1.5}
      MAX_BOUNCE_RATE: ${MAX_BOUNCE_RATE:-0.02}
      MAX_COMPLAINT_RATE: ${MAX_COMPLAINT_RATE:-0.0005}
      DOMAIN_CONCURRENCY_LIMIT: ${DOMAIN_CONCURRENCY_LIMIT:-10}
      RECIPIENT_DOMAIN_RATE_LIMITS: ${RECIPIENT_DOMAIN_RATE_LIMITS:-default=10,gmail.com=5,yahoo.com=5,outlook.com=5}
      # The API validates VERP bounce return paths against this domain; it must
      # match the worker's value or every feedback webhook fails with invalid_verp.
      BOUNCE_DOMAIN: ${BOUNCE_DOMAIN:-bounces.sendwise.test}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      REQUIRE_VERIFIED_DOMAIN: ${REQUIRE_VERIFIED_DOMAIN:-true}
      SUPER_ADMIN_EMAILS: ${SUPER_ADMIN_EMAILS:-}
      PLATFORM_FROM_EMAIL: ${PLATFORM_FROM_EMAIL:-hello@pipsleague.com}
      TRANSACTIONAL_ENABLED: ${TRANSACTIONAL_ENABLED:-false}
      TRANSACTIONAL_SMTP_ENABLED: ${TRANSACTIONAL_SMTP_ENABLED:-false}
      TRANSACTIONAL_SMTP_HOSTNAME: ${TRANSACTIONAL_SMTP_HOSTNAME:-}
      TRANSACTIONAL_SMTP_BIND_ADDRESS: ${TRANSACTIONAL_SMTP_BIND_ADDRESS:-0.0.0.0}
      TRANSACTIONAL_SMTP_STARTTLS_ADDR: ${TRANSACTIONAL_SMTP_STARTTLS_ADDR:-0.0.0.0:2587}
      TRANSACTIONAL_SMTP_IMPLICIT_TLS_ADDR: ${TRANSACTIONAL_SMTP_IMPLICIT_TLS_ADDR:-0.0.0.0:2465}
      TRANSACTIONAL_SMTP_TLS_CERT: ${TRANSACTIONAL_SMTP_TLS_CERT:-/run/sendwise/smtp-certs/fullchain.pem}
      TRANSACTIONAL_SMTP_TLS_KEY: ${TRANSACTIONAL_SMTP_TLS_KEY:-/run/sendwise/smtp-certs/privkey.pem}
      TRANSACTIONAL_MAX_RETRY_HOURS: ${TRANSACTIONAL_MAX_RETRY_HOURS:-24}
      TRANSACTIONAL_REQUESTS_PER_SECOND: ${TRANSACTIONAL_REQUESTS_PER_SECOND:-5}
      TRANSACTIONAL_DAILY_LIMIT: ${TRANSACTIONAL_DAILY_LIMIT:-1000}
      TRANSACTIONAL_MONTHLY_LIMIT: ${TRANSACTIONAL_MONTHLY_LIMIT:-10000}
      TRANSACTIONAL_MAX_RECIPIENTS: ${TRANSACTIONAL_MAX_RECIPIENTS:-10}
      TRANSACTIONAL_MAX_MESSAGE_BYTES: ${TRANSACTIONAL_MAX_MESSAGE_BYTES:-10485760}
      TRANSACTIONAL_WORKER_CONCURRENCY: ${TRANSACTIONAL_WORKER_CONCURRENCY:-4}
      TRANSACTIONAL_SMTP_POOL_SIZE: ${TRANSACTIONAL_SMTP_POOL_SIZE:-4}
      TRANSACTIONAL_MAX_BOUNCE_RATE: ${TRANSACTIONAL_MAX_BOUNCE_RATE:-0.05}
      TRANSACTIONAL_MAX_COMPLAINT_RATE: ${TRANSACTIONAL_MAX_COMPLAINT_RATE:-0.003}
      TRANSACTIONAL_MINIMUM_SAMPLE_SIZE: ${TRANSACTIONAL_MINIMUM_SAMPLE_SIZE:-100}
    depends_on:
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_started
      redis:
        condition: service_healthy
    volumes:
      - ./secrets/stalwart/certs:/run/sendwise/smtp-certs:ro
    ports:
      - "127.0.0.1:8080:8080"
      - "${TRANSACTIONAL_SMTP_HOST_BIND_ADDRESS:-127.0.0.1}:${TRANSACTIONAL_SMTP_STARTTLS_HOST_PORT:-2587}:2587"
      - "${TRANSACTIONAL_SMTP_HOST_BIND_ADDRESS:-127.0.0.1}:${TRANSACTIONAL_SMTP_IMPLICIT_TLS_HOST_PORT:-2465}:2465"

  worker:
    build:
      context: .
      target: worker
    environment:
      APP_ENV: ${APP_ENV:-development}
      HTTP_ADDR: ${HTTP_ADDR:-:8080}
      WORKER_METRICS_ADDR: ${WORKER_METRICS_ADDR:-:9091}
      DATABASE_URL: postgres://${POSTGRES_USER:-email}:${POSTGRES_PASSWORD:-email}@postgres:5432/${POSTGRES_DB:-email}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      NATS_URL: nats://nats:4222
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_ISSUER: ${JWT_ISSUER:-email-platform}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?Set WEBHOOK_SECRET in .env}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost}
      API_BASE_URL: ${API_BASE_URL:-http://localhost}
      TRACKING_BASE_URL: ${TRACKING_BASE_URL:-http://localhost}
      AUTO_MIGRATE: ${AUTO_MIGRATE:-false}
      MIGRATIONS_DIR: /app/migrations
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      SMTP_ADDR: ${SMTP_ADDR:-mailpit:1025}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-newsletter@example.com}
      STALWART_MANAGEMENT_URL: ${STALWART_MANAGEMENT_URL:-http://stalwart:8080}
      STALWART_ADMIN_USERNAME: ${STALWART_ADMIN_USERNAME:-}
      STALWART_ADMIN_PASSWORD: ${STALWART_ADMIN_PASSWORD:-}
      SMTP_POOL_SIZE: ${SMTP_POOL_SIZE:-10}
      BOUNCE_DOMAIN: ${BOUNCE_DOMAIN:-bounces.sendwise.test}
      CONTACT_NOTIFY_EMAIL: ${CONTACT_NOTIFY_EMAIL:-}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-auto}
      DKIM_ENCRYPTION_KEY: ${DKIM_ENCRYPTION_KEY:-}
      DKIM_SELECTOR: ${DKIM_SELECTOR:-mail}
      SPF_INCLUDE: ${SPF_INCLUDE:-}
      DNS_RESOLVER_ADDR: ${DNS_RESOLVER_ADDR:-}
      DNS_RESOLVER_TIMEOUT: ${DNS_RESOLVER_TIMEOUT:-2s}
      SENDING_RATE_PER_SECOND: ${SENDING_RATE_PER_SECOND:-20}
      PLATFORM_MAX_DOMAIN_RATE: ${PLATFORM_MAX_DOMAIN_RATE:-1000}
      MAX_DELIVERY_ATTEMPTS: ${MAX_DELIVERY_ATTEMPTS:-5}
      SCHEDULER_INTERVAL: ${SCHEDULER_INTERVAL:-15s}
      MAX_MESSAGE_AGE: ${MAX_MESSAGE_AGE:-48h}
      NATS_STALE_PUBLISH_TIMEOUT: ${NATS_STALE_PUBLISH_TIMEOUT:-10m}
      DELIVERY_JOURNEY_RECONCILE_INTERVAL: ${DELIVERY_JOURNEY_RECONCILE_INTERVAL:-1m}
      DELIVERY_JOURNEY_RECONCILE_BATCH: ${DELIVERY_JOURNEY_RECONCILE_BATCH:-100}
      DELIVERY_JOURNEY_STUCK_AFTER: ${DELIVERY_JOURNEY_STUCK_AFTER:-30m}
      DELIVERY_JOURNEY_LEGACY_BOUNCE_DOMAINS: ${DELIVERY_JOURNEY_LEGACY_BOUNCE_DOMAINS:-}
      MAX_DAILY_EMAILS: ${MAX_DAILY_EMAILS:-10000}
      WARMUP_START_PER_DAY: ${WARMUP_START_PER_DAY:-50}
      WARMUP_GROWTH_FACTOR: ${WARMUP_GROWTH_FACTOR:-1.5}
      MAX_BOUNCE_RATE: ${MAX_BOUNCE_RATE:-0.02}
      MAX_COMPLAINT_RATE: ${MAX_COMPLAINT_RATE:-0.0005}
      DOMAIN_CONCURRENCY_LIMIT: ${DOMAIN_CONCURRENCY_LIMIT:-10}
      RECIPIENT_DOMAIN_RATE_LIMITS: ${RECIPIENT_DOMAIN_RATE_LIMITS:-default=10,gmail.com=5,yahoo.com=5,outlook.com=5}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      REQUIRE_VERIFIED_DOMAIN: ${REQUIRE_VERIFIED_DOMAIN:-true}
      SUPER_ADMIN_EMAILS: ${SUPER_ADMIN_EMAILS:-}
      PLATFORM_FROM_EMAIL: ${PLATFORM_FROM_EMAIL:-hello@pipsleague.com}
      TRANSACTIONAL_ENABLED: ${TRANSACTIONAL_ENABLED:-false}
      TRANSACTIONAL_SMTP_ENABLED: ${TRANSACTIONAL_SMTP_ENABLED:-false}
      TRANSACTIONAL_SMTP_HOSTNAME: ${TRANSACTIONAL_SMTP_HOSTNAME:-}
      TRANSACTIONAL_SMTP_BIND_ADDRESS: ${TRANSACTIONAL_SMTP_BIND_ADDRESS:-0.0.0.0}
      TRANSACTIONAL_SMTP_STARTTLS_ADDR: ${TRANSACTIONAL_SMTP_STARTTLS_ADDR:-0.0.0.0:2587}
      TRANSACTIONAL_SMTP_IMPLICIT_TLS_ADDR: ${TRANSACTIONAL_SMTP_IMPLICIT_TLS_ADDR:-0.0.0.0:2465}
      TRANSACTIONAL_SMTP_TLS_CERT: ${TRANSACTIONAL_SMTP_TLS_CERT:-/run/sendwise/smtp-certs/fullchain.pem}
      TRANSACTIONAL_SMTP_TLS_KEY: ${TRANSACTIONAL_SMTP_TLS_KEY:-/run/sendwise/smtp-certs/privkey.pem}
      TRANSACTIONAL_MAX_RETRY_HOURS: ${TRANSACTIONAL_MAX_RETRY_HOURS:-24}
      TRANSACTIONAL_REQUESTS_PER_SECOND: ${TRANSACTIONAL_REQUESTS_PER_SECOND:-5}
      TRANSACTIONAL_DAILY_LIMIT: ${TRANSACTIONAL_DAILY_LIMIT:-1000}
      TRANSACTIONAL_MONTHLY_LIMIT: ${TRANSACTIONAL_MONTHLY_LIMIT:-10000}
      TRANSACTIONAL_MAX_RECIPIENTS: ${TRANSACTIONAL_MAX_RECIPIENTS:-10}
      TRANSACTIONAL_MAX_MESSAGE_BYTES: ${TRANSACTIONAL_MAX_MESSAGE_BYTES:-10485760}
      TRANSACTIONAL_WORKER_CONCURRENCY: ${TRANSACTIONAL_WORKER_CONCURRENCY:-4}
      TRANSACTIONAL_SMTP_POOL_SIZE: ${TRANSACTIONAL_SMTP_POOL_SIZE:-4}
      TRANSACTIONAL_MAX_BOUNCE_RATE: ${TRANSACTIONAL_MAX_BOUNCE_RATE:-0.05}
      TRANSACTIONAL_MAX_COMPLAINT_RATE: ${TRANSACTIONAL_MAX_COMPLAINT_RATE:-0.003}
      TRANSACTIONAL_MINIMUM_SAMPLE_SIZE: ${TRANSACTIONAL_MINIMUM_SAMPLE_SIZE:-100}
    depends_on:
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_started
      redis:
        condition: service_healthy
    volumes:
      - ./secrets/stalwart/certs:/run/sendwise/smtp-certs:ro
    ports:
      - "127.0.0.1:9091:9091"

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: ${API_BASE_URL:-http://localhost}
    environment:
      NEXT_PUBLIC_API_URL: ${API_BASE_URL:-http://localhost}
    depends_on:
      - api
    ports:
      - "127.0.0.1:3000:3000"

  caddy:
    image: caddy:2-alpine
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      API_UPSTREAM: api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
      - api

  prometheus:
    image: prom/prometheus:latest
    profiles: ["observability"]
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:latest
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana

  loki:
    image: grafana/loki:latest
    profiles: ["observability"]
    ports:
      - "127.0.0.1:3100:3100"
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./infrastructure/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki

volumes:
  postgres-data:
  redis-data:
  nats-data:
  stalwart-data:
  minio-data:
  caddy-data:
  caddy-config:
  prometheus-data:
  grafana-data:
  loki-data:
