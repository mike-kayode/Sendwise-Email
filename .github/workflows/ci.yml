name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GO_VERSION: "1.26"
  NODE_VERSION: "20"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Go vet
        run: go vet ./...
      - name: Go fmt check
        run: |
          gofmt -l cmd internal services shared
          test -z "$(gofmt -l cmd internal services shared)"
      - name: Go build
        run: go build ./...
      - name: Validate Compose files
        env:
          SERVICE_TOKEN: ci-only-service-token
          WEBHOOK_SECRET: ci-only-webhook-secret
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.microservices.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.microservices.yml config -q

  test-go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: email
          POSTGRES_PASSWORD: email
          POSTGRES_DB: email
        options: >-
          --health-cmd "pg_isready -U email -d email"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
      nats:
        image: nats:2.10-alpine
        command: ["-js"]
        ports:
          - 4222:4222
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Go test
        env:
          DATABASE_URL: postgres://email:email@localhost:5432/email?sslmode=disable
          REDIS_URL: redis://localhost:6379/0
          NATS_URL: nats://localhost:4222
          JWT_SECRET: test-secret-do-not-use-in-production
        run: go test ./...

  test-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm --prefix apps/web install
      - name: Typecheck
        run: npm --prefix apps/web run typecheck
      - name: Lint
        run: npm --prefix apps/web run lint
      - name: Test
        run: npm --prefix apps/web test
      - name: Build
        run: npm --prefix apps/web run build

  e2e:
    runs-on: ubuntu-latest
    needs: [lint, test-go, test-web]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json
      - name: Install frontend dependencies
        run: npm --prefix apps/web install --no-fund --no-audit
      - name: Start local stack
        run: docker compose up -d postgres redis nats mailpit migrate api worker web
      - name: Run browser E2E smoke suite
        env:
          E2E_BASE_URL: http://localhost:3000
          E2E_API_ORIGIN: http://localhost
          DEPLOY_SMOKE_EMAIL: smoke@sendwise.test
          DEPLOY_SMOKE_PASSWORD: SmokeTest2026!
        run: npm --prefix apps/web run test:e2e -- --reporter=line

  docker-build:
    runs-on: ubuntu-latest
    needs: [lint, test-go]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build identity service
        run: docker build --target identity -t email-platform-identity:ci .
      - name: Build workspace service
        run: docker build --target workspace -t email-platform-workspace:ci .
      - name: Build gateway service
        run: docker build --target gateway -t email-platform-gateway:ci .
      - name: Build migrate
        run: docker build --target migrate -t email-platform-migrate:ci .