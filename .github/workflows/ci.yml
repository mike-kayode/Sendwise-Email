name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GO_VERSION: "1.26"
  NODE_VERSION: "22"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Go vet
        run: go vet ./...
      - name: Go fmt check
        run: |
          gofmt -l cmd internal services shared
          test -z "$(gofmt -l cmd internal services shared)"
      - name: Go build
        run: go build ./...
      - name: Reject coming-soon placeholders
        run: |
          if git grep -n -i -E 'coming[[:space:]-]+soon' -- apps/web; then
            echo "Remove coming-soon placeholder text before merging."
            exit 1
          fi
      - name: Validate Compose files
        env:
          SERVICE_TOKEN: ci-only-service-token
          WEBHOOK_SECRET: ci-only-webhook-secret
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.microservices.yml config -q

  deploy-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate deploy script with a sample .env
        run: |
          tmp_env="$(mktemp)"
          cp .env.example "$tmp_env"
          cat >> "$tmp_env" <<'EOF'
          SERVICE_TOKEN=ci-only-service-token
          POSTGRES_PASSWORD=email
          IDENTITY_DB_PASSWORD=identity_app
          WORKSPACE_DB_PASSWORD=workspace_app
          JWT_SECRET=ci-only-jwt-secret
          WEBHOOK_SECRET=ci-only-webhook-secret
          DKIM_ENCRYPTION_KEY=ci-only-dkim-key
          EOF
          SENDWISE_ENV_FILE="$tmp_env" ./scripts/deploy.sh validate

  test-go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: email
          POSTGRES_PASSWORD: email
          POSTGRES_DB: email
        options: >-
          --health-cmd "pg_isready -U email -d email"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
      nats:
        image: nats:2.10-alpine
        command: "-js"
        ports:
          - 4222:4222
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Provision local Stalwart with the management API
        env:
          WEBHOOK_SECRET: ci-only-webhook-secret
          STALWART_DOMAIN: sendwise.test
          STALWART_HOSTNAME: mail.sendwise.test
          STALWART_ADMIN_USERNAME: admin
          STALWART_ADMIN_PASSWORD: ci-only-stalwart-admin-password
          STALWART_SUBMIT_USERNAME: noreply
          STALWART_SUBMIT_PASSWORD: ci-only-stalwart-submit-password
        run: ./scripts/provision-stalwart.sh
      - name: Go test
        env:
          DATABASE_URL: postgres://email:email@localhost:5432/email?sslmode=disable
          TEST_DATABASE_URL: postgres://email:email@localhost:5432/email?sslmode=disable
          REDIS_URL: redis://localhost:6379/0
          NATS_URL: nats://localhost:4222
          JWT_SECRET: test-secret-do-not-use-in-production
          MAIL_PROVIDER: smtp
          SMTP_ADDR: 127.0.0.1:1025
          SMTP_HOST: mailpit
          SMTP_FROM: ci@sendwise.test
          RUN_STALWART_INTEGRATION: "1"
          STALWART_URL: http://127.0.0.1:8081
          STALWART_DOMAIN: sendwise.test
          STALWART_HOSTNAME: mail.sendwise.test
          STALWART_SUBMIT_USERNAME: noreply
          STALWART_SUBMIT_PASSWORD: ci-only-stalwart-submit-password
          STALWART_SMTP_ADDR: 127.0.0.1:587
          STALWART_SMTP_HOST: localhost
        run: go test ./...

  test-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm --prefix apps/web install
      - name: Typecheck
        run: npm --prefix apps/web run typecheck
      - name: Lint
        run: npm --prefix apps/web run lint
      - name: Test
        run: npm --prefix apps/web test
      - name: Build
        run: npm --prefix apps/web run build

  e2e:
    runs-on: ubuntu-latest
    needs: [lint, test-go, test-web]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json
      - name: Install frontend dependencies
        run: npm --prefix apps/web install --no-fund --no-audit
      - name: Install Playwright browser
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Start local stack
        env:
          APP_ENV: development
          API_BASE_URL: http://localhost:8084
          APP_BASE_URL: http://localhost:3000
          CORS_ORIGINS: http://localhost:3000
          DKIM_ENCRYPTION_KEY: ci-only-dkim-encryption-key-do-not-use-in-production
          JWT_SECRET: ci-only-jwt-secret-do-not-use-in-production
          SERVICE_TOKEN: ci-only-service-token
          WEBHOOK_SECRET: ci-only-webhook-secret
          MAIL_PROVIDER: smtp
          SMTP_ADDR: mailpit:1025
          SMTP_HOST: mailpit
          SMTP_USERNAME: ""
          SMTP_PASSWORD: ""
          SMTP_FROM: ci@sendwise.test
          REQUIRE_VERIFIED_DOMAIN: "false"
          GATEWAY_AUTH_RATE_PER_MINUTE: "600"
          GATEWAY_AUTH_BURST: "100"
        run: docker compose -f docker-compose.yml -f docker-compose.microservices.yml up -d postgres redis nats mailpit migrate identity-db-migrate workspace-db-migrate identity workspace gateway api worker web
      - name: Seed E2E account
        env:
          APP_ENV: development
          DATABASE_URL: postgres://email:email@localhost:5432/identity?sslmode=disable
          DEV_SEED_EMAIL: smoke@sendwise.test
          DEV_SEED_PASSWORD: SmokeTest2026!
          DEV_SEED_NAME: CI Smoke User
          DEV_SEED_ORGANIZATION: CI Smoke Workspace
        run: go run ./services/identity/cmd/devseed
      - name: Wait for seeded account membership
        env:
          DEV_SEED_EMAIL: smoke@sendwise.test
          DEV_SEED_PASSWORD: SmokeTest2026!
        run: |
          for attempt in $(seq 1 30); do
            status=$(curl -sS -o /dev/null -w '%{http_code}' \
              -H 'Content-Type: application/json' \
              --data "{\"email\":\"$DEV_SEED_EMAIL\",\"password\":\"$DEV_SEED_PASSWORD\"}" \
              http://localhost:8084/api/v1/auth/login)
            if [ "$status" = 200 ]; then
              exit 0
            fi
            sleep 1
          done
          echo "Seeded account did not become available through the gateway"
          exit 1
      - name: Run browser E2E smoke suite
        env:
          APP_ENV: development
          SERVICE_TOKEN: ci-only-service-token
          WEBHOOK_SECRET: ci-only-webhook-secret
          DKIM_ENCRYPTION_KEY: ci-only-dkim-encryption-key-do-not-use-in-production
          E2E_BASE_URL: http://localhost:3000
          E2E_API_ORIGIN: http://localhost:8084
          MAILPIT_API_URL: http://localhost:8025
          DEPLOY_SMOKE_EMAIL: smoke@sendwise.test
          DEPLOY_SMOKE_PASSWORD: SmokeTest2026!
        run: npm --prefix apps/web run test:e2e -- --reporter=line

  docker-build:
    runs-on: ubuntu-latest
    needs: [lint, test-go]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build identity service
        run: docker build --target identity -t email-platform-identity:ci .
      - name: Build workspace service
        run: docker build --target workspace -t email-platform-workspace:ci .
      - name: Build gateway service
        run: docker build --target gateway -t email-platform-gateway:ci .
      - name: Build migrate
        run: docker build --target migrate -t email-platform-migrate:ci .