name: email-platform

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-email}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-email}
      POSTGRES_DB: ${POSTGRES_DB:-email}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-email} -d ${POSTGRES_DB:-email}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data"]
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    volumes:
      - nats-data:/data

  stalwart:
    image: stalwartlabs/stalwart:latest
    hostname: mail.localhost
    ports:
      - "127.0.0.1:25:25"
      - "127.0.0.1:465:465"
      - "127.0.0.1:587:587"
      - "127.0.0.1:8081:8080"
    volumes:
      - stalwart-data:/opt/stalwart
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data

  identity-db-migrate:
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-email}:${POSTGRES_PASSWORD:-email}@postgres:5432/identity?sslmode=disable
      MIGRATIONS_DIR: /app/services/identity/migrations
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  workspace-db-migrate:
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-email}:${POSTGRES_PASSWORD:-email}@postgres:5432/workspace?sslmode=disable
      MIGRATIONS_DIR: /app/services/workspace/migrations
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  identity:
    build:
      context: .
      dockerfile: services/identity/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-production}
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-email}:${POSTGRES_PASSWORD:-email}@postgres:5432/identity?sslmode=disable
      NATS_URL: nats://nats:4222
      JWT_SECRET: ${JWT_SECRET:-}
      SERVICE_TOKEN: ${SERVICE_TOKEN:-}
      AUTO_MIGRATE: "false"
      MIGRATIONS_DIR: /app/services/identity/migrations
      JWT_ISSUER: ${JWT_ISSUER:-email-platform}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      APP_BASE_URL: ${APP_BASE_URL:-https://campaign.pipsleague.com}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-smtp}
      SMTP_ADDR: ${SMTP_ADDR:-host.docker.internal:587}
      SMTP_HOST: ${SMTP_HOST:-stalwart}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@pipsleague.com}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-noreply@pipsleague.com}
      RESEND_FROM_NAME: ${RESEND_FROM_NAME:-Sendwise}
      WORKSPACE_URL: ${WORKSPACE_URL:-http://workspace:8080}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      identity-db-migrate:
        condition: service_completed_successfully
      nats:
        condition: service_started
    ports:
      - "127.0.0.1:8082:8080"
    restart: unless-stopped

  workspace:
    build:
      context: .
      dockerfile: services/workspace/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-production}
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-email}:${POSTGRES_PASSWORD:-email}@postgres:5432/workspace?sslmode=disable
      NATS_URL: nats://nats:4222
      AUTO_MIGRATE: "false"
      MIGRATIONS_DIR: /app/services/workspace/migrations
      JWT_SECRET: ${JWT_SECRET:-}
      SERVICE_TOKEN: ${SERVICE_TOKEN:-}
      JWT_ISSUER: ${JWT_ISSUER:-email-platform}
    depends_on:
      workspace-db-migrate:
        condition: service_completed_successfully
      nats:
        condition: service_started
    ports:
      - "127.0.0.1:8083:8080"
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-production}
      HTTP_ADDR: ":8080"
      IDENTITY_URL: http://identity:8080
      WORKSPACE_URL: http://workspace:8080
    depends_on:
      identity:
        condition: service_started
      workspace:
        condition: service_started
    ports:
      - "127.0.0.1:8084:8080"
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: ${API_BASE_URL:-https://campaign.pipsleague.com}
    environment:
      NEXT_PUBLIC_API_URL: ${API_BASE_URL:-https://campaign.pipsleague.com}
    depends_on:
      - gateway
    ports:
      - "127.0.0.1:3000:3000"

  caddy:
    image: caddy:2-alpine
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
      - gateway

volumes:
  postgres-data:
  redis-data:
  nats-data:
  stalwart-data:
  minio-data:
  caddy-data:
  caddy-config:
