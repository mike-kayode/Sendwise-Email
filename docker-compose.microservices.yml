name: email-platform

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-email}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-email}
      POSTGRES_DB: ${POSTGRES_DB:-email}
      IDENTITY_DB_USER: ${IDENTITY_DB_USER:-identity_app}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:-identity_app}
      WORKSPACE_DB_USER: ${WORKSPACE_DB_USER:-workspace_app}
      WORKSPACE_DB_PASSWORD: ${WORKSPACE_DB_PASSWORD:-workspace_app}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-email} -d ${POSTGRES_DB:-email}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data"]
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    volumes:
      - nats-data:/data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

  stalwart:
    image: stalwartlabs/stalwart@sha256:73c684a84c24f5b4206ec266a8deb8986fe44a9f623997e07f084388d943c8bd
    hostname: mail.localhost
    environment:
      STALWART_RECOVERY_ADMIN: ${STALWART_RECOVERY_ADMIN:-}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "openssl s_client -starttls smtp -connect 127.0.0.1:587 -servername localhost -brief </dev/null 2>&1 | grep -q 'Ciphersuite:' && openssl s_client -connect 127.0.0.1:465 -servername localhost -brief </dev/null 2>&1 | grep -q 'Ciphersuite:'",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    ports:
      - "${STALWART_BIND_ADDRESS:-127.0.0.1}:${STALWART_PORT_25:-25}:25"
      - "${STALWART_BIND_ADDRESS:-127.0.0.1}:${STALWART_PORT_465:-465}:465"
      - "${STALWART_BIND_ADDRESS:-127.0.0.1}:${STALWART_PORT_587:-587}:587"
      - "127.0.0.1:${STALWART_ADMIN_PORT:-8081}:8080"
    volumes:
      - stalwart-data:/opt/stalwart
      - ${STALWART_CERTS_DIR:-./secrets/stalwart/certs}:/etc/stalwart/certs:ro
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    profiles: ["storage"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data

  identity-db-migrate:
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-email}:${POSTGRES_PASSWORD:-email}@postgres:5432/identity?sslmode=disable
      MIGRATIONS_DIR: /app/services/identity/migrations
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  workspace-db-migrate:
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-email}:${POSTGRES_PASSWORD:-email}@postgres:5432/workspace?sslmode=disable
      MIGRATIONS_DIR: /app/services/workspace/migrations
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  identity:
    build:
      context: .
      dockerfile: services/identity/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-production}
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-email}:${POSTGRES_PASSWORD:-email}@postgres:5432/identity?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      NATS_URL: nats://nats:4222
      JWT_SECRET: ${JWT_SECRET:-}
      SERVICE_TOKEN: ${SERVICE_TOKEN:?Set SERVICE_TOKEN in .env}
      AUTO_MIGRATE: "false"
      MIGRATIONS_DIR: /app/services/identity/migrations
      JWT_ISSUER: ${JWT_ISSUER:-email-platform}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      APP_BASE_URL: ${APP_BASE_URL:-https://campaign.pipsleague.com}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-smtp}
      SMTP_ADDR: ${SMTP_ADDR:-mailpit:1025}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_TLS_MODE: ${SMTP_TLS_MODE:-none}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-hello@pipsleague.com}
      DKIM_ENCRYPTION_KEY: ${DKIM_ENCRYPTION_KEY:-}
      PLATFORM_FROM_EMAIL: ${PLATFORM_FROM_EMAIL:-hello@pipsleague.com}
      PLATFORM_RESEND_API_KEY: ${PLATFORM_RESEND_API_KEY:-}
      WORKSPACE_URL: http://workspace:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      identity-db-migrate:
        condition: service_completed_successfully
      nats:
        condition: service_started
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8082:8080"
    restart: unless-stopped

  workspace:
    build:
      context: .
      dockerfile: services/workspace/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-production}
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-email}:${POSTGRES_PASSWORD:-email}@postgres:5432/workspace?sslmode=disable
      NATS_URL: nats://nats:4222
      AUTO_MIGRATE: "false"
      MIGRATIONS_DIR: /app/services/workspace/migrations
      JWT_SECRET: ${JWT_SECRET:-}
      SERVICE_TOKEN: ${SERVICE_TOKEN:?Set SERVICE_TOKEN in .env}
      JWT_ISSUER: ${JWT_ISSUER:-email-platform}
      IDENTITY_URL: http://identity:8080
    depends_on:
      workspace-db-migrate:
        condition: service_completed_successfully
      nats:
        condition: service_started
    ports:
      - "127.0.0.1:8083:8080"
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-production}
      HTTP_ADDR: ":8080"
      IDENTITY_URL: http://identity:8080
      WORKSPACE_URL: http://workspace:8080
      LEGACY_API_URL: http://api:8080
      SERVICE_TOKEN: ${SERVICE_TOKEN:?Set SERVICE_TOKEN in .env}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_ISSUER: ${JWT_ISSUER:-email-platform}
      GATEWAY_AUTH_RATE_PER_MINUTE: ${GATEWAY_AUTH_RATE_PER_MINUTE:-60}
      GATEWAY_AUTH_BURST: ${GATEWAY_AUTH_BURST:-20}
    depends_on:
      identity:
        condition: service_started
      workspace:
        condition: service_started
    ports:
      - "127.0.0.1:8084:8080"
    restart: unless-stopped

  api:
    environment:
      IDENTITY_URL: http://identity:8080
      SERVICE_TOKEN: ${SERVICE_TOKEN:?Set SERVICE_TOKEN in .env}
    depends_on:
      identity:
        condition: service_started

  # The worker loads the shared API config, which requires the identity
  # upstream in staging/production; without these it exits at startup.
  worker:
    environment:
      IDENTITY_URL: http://identity:8080
      SERVICE_TOKEN: ${SERVICE_TOKEN:?Set SERVICE_TOKEN in .env}
    depends_on:
      identity:
        condition: service_started

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: ${API_BASE_URL:-https://campaign.pipsleague.com}
    environment:
      NEXT_PUBLIC_API_URL: ${API_BASE_URL:-https://campaign.pipsleague.com}
    depends_on:
      - gateway
    ports:
      - "127.0.0.1:3000:3000"

  caddy:
    image: caddy:2-alpine
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
      - gateway

volumes:
  postgres-data:
  redis-data:
  nats-data:
  stalwart-data:
  minio-data:
  caddy-data:
  caddy-config:
